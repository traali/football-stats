<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnaus – ohjaus</title>
<meta http-equiv="refresh" content="0;url=./#/">
<script>
(function () {
  try {
    var qs = new URLSearchParams(location.search);
    var slug = qs.get('t') || '';
    var club = qs.get('clubId') || '';
    var team = qs.get('teamId') || '';
    if (!slug) {
      var u = (qs.get('u') || '').trim();
      if (u) {
        try {
          var parsed = new URL(u);
          var m = parsed.pathname.match(/\/t\/([^/]+)/);
          if (m) slug = decodeURIComponent(m[1]);
          club = club || parsed.searchParams.get('clubId') || '';
          team = team || parsed.searchParams.get('teamId') || '';
        } catch (e) {}
      }
    }
    if (slug && /^[A-Za-z0-9-]{8,200}$/.test(slug)) {
      var path = '#/fudis/' + encodeURIComponent(slug) + (team && /^\d+$/.test(team) ? '/' + team : '');
      var q = new URLSearchParams();
      if (club && /^\d+$/.test(club)) q.set('clubId', club);
      location.replace('./' + path + (q.toString() ? '?' + q.toString() : ''));
      return;
    }
    location.replace('./#/');
  } catch (e) {
    location.replace('./#/');
  }
})();
</script>
</head>
<body style="font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding:2rem;text-align:center">
  <p>Siirrytään turnausnäkymään…</p>
  <p><a href="./#/" style="color:#93c5fd">Avaa etusivu</a> ja käytä kohtaa <strong>Lisää turnaus linkillä</strong>.</p>
</body>
</html>
