<!DOCTYPE html>
<html lang="fi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Stats MCP App H2H Card</title>
  <style>
    :root {
      --nv-bg-canvas: #090d16;
      --nv-bg-surface: #111827;
      --nv-text-primary: #f9fafb;
      --nv-text-muted: #9ca3af;
      --nv-pitch: #10b981;
      --nv-radar: #f59e0b;
      --nv-stoppage: #ef4444;
      --nv-border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--nv-bg-canvas);
      color: var(--nv-text-primary);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--nv-border);
      border-radius: 16px;
      padding: 14px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .league-badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .matchup {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      text-align: center;
      margin-bottom: 14px;
    }
    .team-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .vs {
      font-size: 12px;
      color: var(--nv-text-muted);
      font-weight: 800;
    }
    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }
    .stat-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--nv-text-muted);
    }
    .bar-track {
      height: 8px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 9999px;
      overflow: hidden;
      display: flex;
      gap: 2px;
    }
    .bar-home {
      background: var(--nv-pitch);
      height: 100%;
      border-radius: 9999px 0 0 9999px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bar-away {
      background: var(--nv-radar);
      height: 100%;
      border-radius: 0 9999px 9999px 0;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .form-pill {
      display: inline-flex;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      margin-top: 4px;
    }
    .form-w { color: var(--nv-pitch); }
    .form-d { color: var(--nv-radar); }
    .form-l { color: var(--nv-stoppage); }
    footer {
      font-size: 10px;
      color: var(--nv-text-muted);
      display: flex;
      justify-content: space-between;
      padding-top: 4px;
      border-top: 1px solid var(--nv-border);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="league-badge" id="leagueTitle">Sarjaottelu</span>
      <span style="font-size: 10px; color: var(--nv-text-muted);">Night Captain H2H</span>
    </div>

    <div class="matchup">
      <div style="text-align: left;">
        <div class="team-name" id="homeName">Kotijoukkue</div>
        <div class="form-pill" id="homeForm">
          <span class="form-w">W</span><span class="form-w">W</span><span class="form-d">D</span>
        </div>
      </div>
      <div class="vs">VS</div>
      <div style="text-align: right;">
        <div class="team-name" id="awayName">Vierasjoukkue</div>
        <div class="form-pill" id="awayForm">
          <span class="form-w">W</span><span class="form-l">L</span><span class="form-w">W</span>
        </div>
      </div>
    </div>

    <!-- Metric 1: Win Probability / Strength -->
    <div class="stat-row">
      <div class="stat-label">
        <span style="color: var(--nv-pitch);" id="homeStrength">55%</span>
        <span>Ottelun voimasuhde</span>
        <span style="color: var(--nv-radar);" id="awayStrength">45%</span>
      </div>
      <div class="bar-track">
        <div class="bar-home" id="barStrengthHome" style="width: 55%;"></div>
        <div class="bar-away" id="barStrengthAway" style="width: 45%;"></div>
      </div>
    </div>

    <!-- Metric 2: Goals / Match -->
    <div class="stat-row">
      <div class="stat-label">
        <span style="color: var(--nv-pitch);" id="homeGoals">2.4</span>
        <span>Maalikeskiarvo / ottelu</span>
        <span style="color: var(--nv-radar);" id="awayGoals">1.8</span>
      </div>
      <div class="bar-track">
        <div class="bar-home" id="barGoalsHome" style="width: 57%;"></div>
        <div class="bar-away" id="barGoalsAway" style="width: 43%;"></div>
      </div>
    </div>

    <footer>
      <span>Lähde: Palloliitto Tulospalvelu</span>
      <span>Sopimus: SportStats v1.0.0</span>
    </footer>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const home = params.get('home') || 'Kotijoukkue';
    const away = params.get('away') || 'Vierasjoukkue';
    const league = params.get('league') || 'Sarjaottelu';

    document.getElementById('homeName').textContent = home;
    document.getElementById('awayName').textContent = away;
    document.getElementById('leagueTitle').textContent = league;

    // MCP Ext-Apps JSON-RPC postMessage Bridge (2026 Specification)
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'mcp:init') {
        window.parent.postMessage({ type: 'mcp:ready', protocolVersion: '2026-01' }, '*');
      }
    });
  </script>
</body>
</html>
